name: Add Supabase Client

on:
  push:
    branches:
      - feat/atlas-smm-panel-v1

permissions:
  contents: write

jobs:
  dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atlas-smm-panel-v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Add Supabase client
        run: bun add @supabase/supabase-js
      - name: Commit dependency and lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          git config user.name "AtlasHub CI"
          git config user.email "ci@atlashub.digital"
          git add package.json bun.lock
          git commit -m "feat(smm): add Supabase browser client"
          git push origin HEAD:feat/atlas-smm-panel-v1
